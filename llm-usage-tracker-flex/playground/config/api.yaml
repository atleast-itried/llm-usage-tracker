---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: ApiInstance
metadata:
  name: ingress-http
spec:
  address: http://0.0.0.0:8081
  services:
    upstream:
      address: "http://backend"
      routes:
        - config:
            destinationPath: /
  policies:
    - policyRef:
        name: llm-usage-tracker
        namespace: default
      config:
        metricName: "azure.openai.tokens"
        injectIncludeUsage: true
        # notificationUrl: "http://mule-api:8082/usage"
